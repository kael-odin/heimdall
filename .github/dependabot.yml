version: 2
updates:
  - package-ecosystem: npm
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      core-runtime:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      console-frontend:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: npm
    directory: /packages/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
