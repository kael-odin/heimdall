name: CI

# 与 seo-gate.yml 的分工：
#   ci.yml     —— 确定性检查（lint / 测试 / build / smoke），每次 push 与 PR 都跑，不访问被克隆源站
#   seo-gate   —— 联网抓授权站点并与基线比对；当前仅手动触发，配置目标和基线后再考虑定时运行
#   docs.yml   —— 纯文档提交的守卫（链接 + 文档里的规则数字）；本文件用 paths-ignore 跳过这类提交

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-test:
    name: core (test ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir ../console install --frozen-lockfile
      - run: pnpm --dir ../console build
      - run: pnpm test:full -- --test-shard=${{ matrix.shard }}/2
      - name: Preserve core test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-${{ matrix.shard }}-failure-${{ github.run_attempt }}
          path: |
            core/workspace/_runs/**
          if-no-files-found: ignore
          retention-days: 7

  core-smoke:
    name: core (e2e smoke, local fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir ../console install --frozen-lockfile
      - run: pnpm --dir ../console build
      - run: pnpm smoke

  core-lint:
    name: core (lint, docs, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check:docs
      - name: Docker offline delivery (SSR + SPA + data SPA + adapter)
        run: node --test --test-name-pattern='Docker network-none delivery' test/live-deployment-matrix.test.mjs
        env:
          HEIMDALL_DOCKER_TEST: "1"
      - name: Root image builds (Dockerfile is the documented deployment path)
        run: docker build -t heimdall-ci-check ..

  console:
    name: console (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  mcp:
    name: mcp (fresh install, tests, generated plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            core/pnpm-lock.yaml
            packages/mcp/pnpm-lock.yaml
      - run: pnpm -C core install --frozen-lockfile
      - run: pnpm -C core exec playwright install --with-deps chromium
      - run: pnpm -C packages/mcp install --frozen-lockfile
      - run: pnpm -C packages/mcp test
      - run: pnpm -C packages/mcp check:plugin
      - run: node scripts/sync-skills.mjs --check

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm -C core audit --prod --audit-level=moderate --registry=https://registry.npmjs.org
      - run: pnpm -C console audit --prod --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Console dev dependencies (informational)
        continue-on-error: true
        run: pnpm -C console audit --dev --audit-level=moderate --registry=https://registry.npmjs.org
      - run: pnpm -C packages/mcp audit --audit-level=moderate --registry=https://registry.npmjs.org
