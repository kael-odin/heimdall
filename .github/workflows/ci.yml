name: CI

# 与 seo-gate.yml 的分工：
#   ci.yml     —— 确定性检查（lint / 测试 / build / smoke），每次 push 与 PR 都跑，不访问被克隆源站
#   seo-gate   —— 联网抓授权站点并与基线比对；当前仅手动触发，配置目标和基线后再考虑定时运行
#
# 本文件里的测试**需要真浏览器**：core 的测试集里有几条跑的是 capture → build_clone
# 的真实流水线（CSS url() 解析基准、资产按真实类型落盘……），必须能起 Chromium。
# 此前 core job 没装 Chromium，那几条直接抛 "Executable doesn't exist"，
# 于是整个 job 长期变红 —— 而本地（有浏览器）永远是绿的，所以一直没被发现。
# 结论：装了浏览器再跑测试，别让"跑不过"和"环境没装"看起来一样。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux 上完整 Core 测试约 29 分钟，逼近 45 分钟 job 超时；分两片并行后约 15 分钟。
  # 每个分片各自安装依赖、构建控制台（console/dist 是其中一条控制台 E2E 的前提）。
  # 分片只切文件、不切用例：同一个文件里的用例仍在同一个进程里跑，测试内部的共享状态不受影响。
  core-test:
    name: core (test ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 见下方 core 服务 job 的文件头说明：测试集里有真浏览器用例，不装就会红
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir ../console install --frozen-lockfile
      - run: pnpm --dir ../console build
      - run: pnpm test -- --test-shard=${{ matrix.shard }}/2
      - name: Preserve core test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-${{ matrix.shard }}-failure-${{ github.run_attempt }}
          path: |
            core/workspace/_runs/**
          if-no-files-found: ignore
          retention-days: 7

  # 真浏览器冒烟。它们彼此独立（各自用 mkdtemp 临时目录与随机端口、各自起引擎），
  # 所以整体从 core 服务 job 里拆出来并行跑；串行时它们合计约 11 分钟，且任何一条失败都会让
  # 后面的 20 多条根本跑不到 —— 并行后一条红不影响其余诊断。
  core-smoke:
    name: core (e2e smoke, local fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir ../console install --frozen-lockfile
      - run: pnpm --dir ../console build
      - name: Acceptance console (real browser, local model stub)
        run: pnpm acceptance:smoke
      - name: Spec contract console (real browser, local API fixture)
        run: pnpm acceptance:spec:smoke
      - name: Acceptance comparison console (explicit runs, integrity and CLI)
        run: pnpm acceptance:comparison:smoke
      - name: Acceptance project catalog (versions, explicit bindings and two-engine isolation)
        run: pnpm acceptance:catalog:smoke
      - name: Acceptance catalog explicit migration (legacy artifacts, CLI confirmation and browser continuity)
        run: pnpm acceptance:catalog:migration:smoke
      - name: Spec baseline review (candidates, approvals, selections and source integrity)
        run: pnpm acceptance:baseline:smoke
      - name: Managed Spec preparation (immutable contract, replay and zero execution)
        run: pnpm acceptance:managed:prepare:smoke
      - name: Managed Spec result reading (captured evidence and zero execution)
        run: pnpm acceptance:managed:read:smoke
      - name: Owned acceptance recovery (startup barrier, restart and zero execution)
        run: pnpm acceptance:owned:recovery:smoke
      - name: Managed Spec execution (fresh admission, real runner, BUG and cancel)
        run: pnpm acceptance:managed:execute:smoke
      - name: Managed execution UI (explicit click, durable recovery and stop)
        run: pnpm acceptance:execution:ui:smoke
      - name: Browser candidate source (fresh captures and explicit healthy side)
        run: pnpm acceptance:browser:source:smoke
      - name: Browser private source reader (owner fences and unchanged originals)
        run: pnpm acceptance:browser:read:smoke
      - name: Browser source bindings (fresh captures, explicit sides and source revalidation)
        run: pnpm acceptance:browser:bindings:smoke
      - name: Browser source binding console (native HTTP, source review and verified evidence)
        run: pnpm acceptance:browser:bindings:ui:smoke
      - name: Schema4 combined history (fresh Browser bindings and explicit Spec lifecycle fixtures)
        run: pnpm acceptance:browser:bindings:v4:smoke
      - name: Browser full candidates (explicit review, durable save and read-only reconciliation)
        run: pnpm acceptance:browser:candidates:ui:smoke
      - name: Browser single-operation execution (fixed source, real target BUG, explicit retest and restart)
        run: pnpm acceptance:browser:execute:smoke
      - name: Browser start resolution (same unfinished ingress, durable deny, same-origin restart and native locks)
        run: pnpm acceptance:browser:resolution:smoke
      - name: Manual defect tickets (fixed source members, explicit closure, regression and read-only reconciliation)
        run: pnpm acceptance:defect:tickets:smoke
      - name: Manual defect ticket decisions (four real UI races)
        run: node scripts/smoke-acceptance-defect-ticket-decisions-console.mjs workspace/_runs/defect-ticket-decisions-ci
      - name: Verify manual defect ticket decision evidence
        run: node scripts/verify-acceptance-defect-ticket-decisions-console.mjs workspace/_runs/defect-ticket-decisions-ci
      - run: pnpm smoke
      - name: Acceptance detection benchmark (known truth fixtures)
        run: pnpm acceptance:benchmark
      - name: Spec API benchmark (OpenAPI candidates and known truth)
        run: pnpm acceptance:spec:benchmark
      - name: Acceptance comparison benchmark (known retest and false-closure cases)
        run: pnpm acceptance:comparison:benchmark
      - name: Preserve acceptance smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-smoke-failure-${{ github.run_attempt }}
          path: |
            core/workspace/_runs/acceptance-catalog-console/**/failure.json
            core/workspace/_runs/acceptance-catalog-console/**/failure-ui.json
            core/workspace/_runs/acceptance-catalog-console/**/catalog-failure.png
            core/workspace/_runs/acceptance-catalog-console/**/engine-*.log
            core/workspace/_runs/acceptance-catalog-migration/**
            core/workspace/_runs/acceptance-managed-preparation/**
            core/workspace/_runs/acceptance-console/acceptance-failure.json
            core/workspace/_runs/acceptance-console/acceptance-failure.png
            core/workspace/_runs/acceptance-console/engine-error.log
            core/workspace/_runs/managed-execution-*/failure.json
            core/workspace/_runs/managed-execution-*/failure.png
            core/workspace/_runs/managed-execution-*/engine-*.log
            core/workspace/_runs/execution-ui-*/failure.json
            core/workspace/_runs/execution-ui-*/failure*.png
            core/workspace/_runs/execution-ui-*/fixture-*-engine-*.log
            core/workspace/_runs/execution-ui-*/chromium.log
            core/workspace/_runs/browser-source-smoke-*/failure.json
            core/workspace/_runs/browser-source-smoke-*/materials/source-index.json
            core/workspace/_runs/browser-reading-smoke-*/failure.json
            core/workspace/_runs/browser-reading-smoke-*/materials/source-index.json
            core/workspace/_runs/browser-bindings-smoke-*/failure.json
            core/workspace/_runs/browser-bindings-smoke-*/summary.json
            core/workspace/_runs/browser-bindings-smoke-*/checks.json
            core/workspace/_runs/browser-bindings-console-smoke-*/failure.json
            core/workspace/_runs/browser-bindings-console-smoke-*/failure*.png
            core/workspace/_runs/browser-bindings-console-smoke-*/failure*.txt
            core/workspace/_runs/browser-bindings-console-smoke-*/engine.log
            core/workspace/_runs/browser-bindings-console-smoke-*/chromium.log
            core/workspace/_runs/browser-bindings-console-smoke-*/browser-requests.json
            core/workspace/_runs/browser-bindings-console-smoke-*/browser-errors.json
            core/workspace/_runs/browser-bindings-console-smoke-*/target-requests.json
            core/workspace/_runs/browser-bindings-console-smoke-*/browser-checks.json
            core/workspace/_runs/browser-bindings-console-smoke-*/source-file-digests.json
            core/workspace/_runs/browser-bindings-console-smoke-*/catalog-v4-*.json
            core/workspace/_runs/browser-bindings-console-smoke-*/runtime/**
            core/workspace/_runs/browser-candidates-console-smoke-*/**
            core/workspace/_runs/browser-execution-console-smoke-*/**
            core/workspace/_runs/browser-resolution-console-smoke-*/**
            core/workspace/_runs/defect-tickets-console-smoke-*/**
            core/workspace/_runs/defect-ticket-decisions-ci/**
            core/workspace/_runs/defect-tickets-console-smoke-*/failure.json
          if-no-files-found: ignore
          retention-days: 7

  # 只放“不跑浏览器、几秒到几分钟”的确定性检查。此前 lint / 文档 / docker 与 29 分钟测试
  # 以及 11 分钟冒烟挤在同一个 45 分钟 job 里，任何一项超时都会把其它项一起取消，
  # 上面的失败步骤本身就说明了这种互相牵连有多难诊断。
  core-lint:
    name: core (lint, docs, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 严格导出会在候选包里跑断网浏览器探针（逐页加载、观察外联请求），
      # 没装 Chromium 时探针失败 → browserFailed=1 → 导出被阻断。
      # 本 job 原先只跑 lint/docs，加入 Docker 交付验收后必须自带浏览器。
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check:docs
      # 交付包需脱离源工作区，在无外联网络的容器中实际启动。
      - name: Docker offline delivery (SSR + SPA + data SPA + adapter)
        run: node --test --test-name-pattern='Docker network-none delivery' test/live-deployment-matrix.test.mjs
        env:
          HEIMDALL_DOCKER_TEST: "1"
      # 根 Dockerfile 是唯一一条“真的按用户文档部署”的路径，但此前没有任何 CI 守卫 ——
      # 控制台里一个跨目录 import 就能让它构建失败而无人知晓。构建一次约一分半。
      - name: Root image builds (Dockerfile is the documented deployment path)
        run: docker build -t heimdall-ci-check ..

  console:
    name: console (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
