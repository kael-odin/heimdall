name: SEO Regression Gate

# 与 ci.yml 的分工：
#   ci.yml     —— 确定性检查（lint/单测/build/smoke），每次 push 和 PR 都跑，不联网
#   seo-gate   —— 联网抓真实站点并与基线比对，跑得慢且结果受外网影响。
#                 配置授权目标与基线后，再启用 schedule；空目标不能报告为通过。
#
# 门禁口径见 core/src/seo/baseline.mjs 顶部注释：只认具名问题差异，
# LCP/CLS/FCP 属波动规则，不计入判定。

on:
  workflow_dispatch:
    inputs:
      site:
        description: '只审计这个站点（host 或 URL）。留空 = 跑 config/seo-targets.txt 全部'
        required: false
        default: ''
      update_baseline:
        description: '重建基线（会改文件，需自己开 PR 提交）'
        type: boolean
        required: false
        default: false

concurrency:
  group: seo-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: SEO 基线门禁
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: 解析目标站点
        id: targets
        env:
          ONE: ${{ inputs.site }}
        run: |
          set -euo pipefail
          if [ -n "${ONE:-}" ]; then
            printf '%s\n' "$ONE" > "$RUNNER_TEMP/targets.txt"
          elif [ -f ../config/seo-targets.txt ]; then
            grep -vE '^[[:space:]]*(#|$)' ../config/seo-targets.txt > "$RUNNER_TEMP/targets.txt" || true
          else
            : > "$RUNNER_TEMP/targets.txt"
          fi
          echo "targets:"; cat "$RUNNER_TEMP/targets.txt"
          if [ ! -s "$RUNNER_TEMP/targets.txt" ]; then
            echo "::error::没有 SEO 门禁目标；手动指定 site，或提交 config/seo-targets.txt 与对应基线。"
            exit 1
          fi

      # 逐站点跑，全部跑完再汇总结论 ——
      # 中途 fail-fast 会让人修一个跑一次，把 5 分钟的事拖成 5 轮。
      - name: 逐站点跑门禁
        env:
          SEO_MAX: ${{ vars.SEO_MAX || '25' }}
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
        run: |
          set -uo pipefail
          failed=0
          while read -r host; do
            [ -z "$host" ] && continue
            echo "::group::SEO — $host"
            # 目标可能是完整 URL、非默认端口或 http；与 audit 共用同一套
            # path-safe key，避免 sed 截断后把两个 origin 写进同一个基线文件。
            if ! key=$(node --input-type=module -e 'import("./src/seo/baseline-file.mjs").then(({baselineFileKey}) => process.stdout.write(baselineFileKey(process.argv[1]))).catch(error => { console.error(error.message); process.exit(1); })' "$host"); then
              echo "::error::SEO 目标无效：$host"
              failed=1
              echo "::endgroup::"
              continue
            fi
            extra=""
            if [ "${UPDATE_BASELINE:-false}" = "true" ]; then extra="--update-baseline"; fi
            node src/seo/audit.mjs "$host" \
              --max "$SEO_MAX" \
              --baseline "../config/seo-baseline/$key.json" \
              --require-baseline \
              --fail-on-regression \
              $extra || failed=1
            echo "::endgroup::"
          done < "$RUNNER_TEMP/targets.txt"
          if [ "$failed" -ne 0 ]; then
            echo "::error::存在阻断级 SEO 回归，详见上方分组与产物中的 diff.md"
          fi
          exit "$failed"

      - name: 汇总到 Step Summary
        if: always()
        run: |
          shopt -s nullglob
          for md in workspace/*/seo/diff.md; do
            echo "## $(dirname "$(dirname "$md")")" >> "$GITHUB_STEP_SUMMARY"
            cat "$md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            core/workspace/*/seo/seo.html
            core/workspace/*/seo/seo.json
            core/workspace/*/seo/diff.md
            config/seo-baseline/*.json
