name: Heimdall QA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: kael-odin/heimdall/actions/qa-ci@main
        with:
          site: web
          viewports: 1440,390
          failOn: all
          comment: "false"
